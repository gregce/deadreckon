[workspace]
members = [
  "crates/deadreckon",
  "crates/deadreckon-core",
  "crates/deadreckon-providers",
  "crates/deadreckon-sandbox",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "file:///Users/gdc/deadreckon"
categories = ["development-tools"]
keywords = ["agent", "cli", "coding"]

[workspace.dependencies]
axum = "0.8.7"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.53", features = ["derive", "env"] }
crossterm = "0.29.0"
fs2 = "0.4.3"
ignore = "0.4.25"
nix = { version = "0.30.1", features = ["signal", "process"] }
pulldown-cmark = "0.13.0"
ratatui = "0.29.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "time"] }
tokio-stream = "0.1.17"
tokio-util = "0.7.17"
toml = "0.9.8"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
walkdir = "2.5.0"
which = "8.0.0"
