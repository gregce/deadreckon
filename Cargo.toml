[workspace]
members = [
  "crates/deadreckon",
  "crates/deadreckon-core",
  "crates/deadreckon-runtime",
  "crates/deadreckon-providers",
  "crates/deadreckon-sandbox",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0-rc.1"
license = "MIT"
repository = "https://github.com/gregce/deadreckon"
categories = ["development-tools"]
keywords = ["agent", "cli", "coding"]

[workspace.dependencies]
axoupdater = "0.10.0"
axum = "0.8.7"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.53", features = ["derive", "env"] }
clap_complete = "4.5"
crossterm = "0.29.0"
deadreckon-core = { path = "crates/deadreckon-core" }
deadreckon-providers = { path = "crates/deadreckon-providers" }
deadreckon-runtime = { path = "crates/deadreckon-runtime" }
deadreckon-sandbox = { path = "crates/deadreckon-sandbox" }
fs2 = "0.4.3"
ignore = "0.4.25"
nix = { version = "0.30.1", features = ["signal", "process"] }
pulldown-cmark = "0.13.0"
ratatui = "0.29.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
regex = "1.12.2"
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.17"
toml = "0.9.8"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
walkdir = "2.5.0"
which = "8.0.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"
expect_used = "deny"
unwrap_used = "deny"
needless_borrow = "deny"
needless_collect = "deny"
needless_pass_by_value = "warn"
redundant_clone = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_find = "deny"
manual_let_else = "warn"
single_match_else = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
unnecessary_wraps = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
split-debuginfo = "off"
panic = "unwind"

[profile.dev]
debug = "limited"
