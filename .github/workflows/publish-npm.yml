name: Publish npm

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: publish npm packages
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Validate stable npm release lane
        shell: bash
        run: |
          node release/trust/release-trust.mjs validate \
            --ref "refs/tags/$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY"
          node release/trust/release-trust.mjs lane \
            --ref "refs/tags/$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --out npm-release-lane.json
          node -e "const fs = require('node:fs'); const lane = JSON.parse(fs.readFileSync('npm-release-lane.json', 'utf8')); if (lane.lane !== 'stable' || lane.publish_npm !== true) { console.error('npm publishing is allowed only for official stable release tags'); process.exit(1); }"
      - name: Download GitHub release artifacts
        run: |
          mkdir -p target/distrib
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir target/distrib
      - name: Repack npm packages
        run: |
          node npm/scripts/prepare-release.mjs --tag "$RELEASE_TAG" --artifacts target/distrib
      - name: Check npm provenance path
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NODE_AUTH_TOKEN is empty; npm trusted publishing must be configured for this workflow."
          else
            echo "NODE_AUTH_TOKEN is present; npm publish will still request provenance."
          fi
      - name: Publish platform packages
        run: |
          for package_dir in \
            npm/deadreckon-darwin-arm64 \
            npm/deadreckon-darwin-x64 \
            npm/deadreckon-linux-arm64 \
            npm/deadreckon-linux-x64 \
            npm/deadreckon-win32-x64
          do
            npm publish "$package_dir" --access public --provenance
          done
      - name: Publish wrapper package
        run: |
          npm publish npm/deadreckon --access public --provenance
