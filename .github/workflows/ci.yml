name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: fmt + workspace tests (ubuntu)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Checked Watchkeeper evidence is allowed to cite the exact runner
          # from an older source revision; retain history so provenance can be
          # verified instead of depending on the current runner bytes.
          fetch-depth: 0
          persist-credentials: false
      - name: Install test prerequisites
        shell: bash
        run: |
          # expect(1) drives the interactive-prompt tests; the suite fails
          # loudly in CI when it is missing rather than skipping coverage.
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap expect
      - name: Format check
        shell: bash
        run: cargo fmt --check
      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --locked -- -D warnings
      - name: Workspace tests
        shell: bash
        run: |
          # Characterization integration tests invoke the gated compatibility
          # binary directly; build it first just as `make test` does.
          cargo build -p deadreckon --features internal-characterization --bin deadreckon-characterization --locked
          cargo test --workspace --locked --no-fail-fast
          cargo test -p deadreckon --features internal-characterization --test chain --test orchestrate --locked
      - name: Fresh release binary size
        shell: bash
        run: make size-check

  release-zip-smoke:
    name: release ZIP smoke (windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Assemble and verify the Windows release ZIP
        shell: pwsh
        run: node --test release/evaluator-sidecars.test.mjs

  mac-app:
    name: Swift tests + universal app build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install XcodeGen
        shell: bash
        run: brew install xcodegen
      - name: Test macOS release hydration
        shell: bash
        run: node --test release/macos-app.test.mjs
      - name: Test DeadreckonKit
        shell: bash
        run: swift test --package-path deadreckon-mac/DeadreckonKit
      - name: Build clean-checkout universal app
        shell: bash
        working-directory: deadreckon-mac
        run: |
          # Vendored release binaries are intentionally absent from a clean
          # checkout. This gate proves the Swift app compiles universally;
          # the release lane separately hydrates both signed architectures and
          # verifies their exact bytes before and after app packaging.
          xcodegen generate
          xcodebuild \
            -project deadreckon.xcodeproj \
            -scheme deadreckon \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 x86_64" \
            clean build
          lipo \
            build/DerivedData/Build/Products/Release/deadreckon.app/Contents/MacOS/deadreckon \
            -verify_arch arm64 x86_64
