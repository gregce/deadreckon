id = "cli:opencode"
display_name = "OpenCode CLI"
kind = "cli"
default_binary = "opencode"
allow_network_default = true
default_model = "provider default"
sandbox_writes = ["~/.local/share/opencode"]
sandbox_reads = ["~/.local/share/opencode"]
fs_detection_paths = ["~/.local/share/opencode"]
docs_url = "https://opencode.ai/docs/cli/"
subscription = true

[auth]
kind = "subscription"

[version_probe]
args = ["--version"]

# OpenCode 1.18.14 (2026-08-06) keeps project selection, structured output, and
# unattended permission approval under the `run` subcommand. Bind `--dir` to
# DeadReckon's frozen worktree: OpenCode can otherwise select the source
# checkout even when the wrapper process inherited a different cwd. Probe that
# exact surface because top-level `opencode --help` does not expose these flags.
# The outer DeadReckon sandbox remains the hard filesystem/network authority
# when `--auto` approves OpenCode's inner permission prompts. The JSON-lines
# parser retains the last non-null answer and treats nested error messages as
# provider failures.
[exec_template]
args_template = ["run", "--dir", "{cwd}", "{prompt}"]
model_arg = "--model"
timeout_seconds = 1800

[contract]
stream_args = ["--format", "json", "--auto"]
dialect = "json-lines"
conversation_id_path = "/sessionID"
usage_input_path = "/part/tokens/input"
usage_output_path = "/part/tokens/output"
cost_path = "/part/cost"
answer_path = "/part/text"
error_message_path = "/error/data/message"
probe_args = ["run", "--help"]
probe_substring = "--auto"

[install_hint]
url = "https://opencode.ai/docs/"
try_lines = ["curl -fsSL https://opencode.ai/install | bash"]

[ingest]
id_prefix = "opencode:"
env_var = "OPENCODE_DIR"
default_dirs = ["~/.local/share/opencode"]
watch_subdirs = ["storage/session", "storage/message", "storage/part"]
schema = "opencode"
cwd_match = "directory-field"
file_glob = "*.json"
freshness_minutes = 2
storage = "opencode-storage"

[[model_catalog]]
id = "provider default"
aliases = ["opencode-default"]
recommended = true

[[model_catalog]]
id = "anthropic/claude-sonnet-4-5"
context_window = 200000

[[model_catalog]]
id = "anthropic/claude-opus-4-1"
context_window = 200000
