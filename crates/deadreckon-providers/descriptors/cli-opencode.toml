id = "cli:opencode"
display_name = "OpenCode CLI"
kind = "cli"
default_binary = "opencode"
allow_network_default = true
default_model = "provider default"
sandbox_writes = ["~/.local/share/opencode"]
sandbox_reads = ["~/.local/share/opencode"]
fs_detection_paths = ["~/.local/share/opencode"]
docs_url = "https://opencode.ai/docs/cli/"
subscription = true

[auth]
kind = "subscription"

[version_probe]
args = ["--version"]

# Pennant probe (OpenCode CLI 0.15.5, 2026-07-16): `run` supports
# `--format json` and `--session`, but a real successful free-model invocation
# emitted text(answer), error, then text(null) while exiting zero. The pointer
# dialect cannot select the last non-null answer or classify that interleaved
# error safely; a richer event mirror is a V1 escalation. This version also
# rejects the old hidden `--dangerously-skip-permissions` flag.
[exec_template]
args_template = ["run", "{prompt}"]
model_arg = "--model"
timeout_seconds = 1800

[install_hint]
url = "https://opencode.ai/docs/"
try_lines = ["curl -fsSL https://opencode.ai/install | bash"]

[ingest]
id_prefix = "opencode:"
env_var = "OPENCODE_DIR"
default_dirs = ["~/.local/share/opencode"]
watch_subdirs = ["storage/session", "storage/message", "storage/part"]
schema = "opencode"
cwd_match = "directory-field"
file_glob = "*.json"
freshness_minutes = 2
storage = "opencode-storage"

[[model_catalog]]
id = "provider default"
aliases = ["opencode-default"]
recommended = true

[[model_catalog]]
id = "anthropic/claude-sonnet-4-5"
context_window = 200000

[[model_catalog]]
id = "anthropic/claude-opus-4-1"
context_window = 200000
