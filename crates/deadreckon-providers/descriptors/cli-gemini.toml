id = "cli:gemini"
display_name = "Gemini CLI"
kind = "cli"
default_binary = "gemini"
allow_network_default = true
default_model = "provider default"
sandbox_writes = ["~/.gemini"]
sandbox_reads = ["~/.gemini"]
fs_detection_paths = ["~/.gemini"]
docs_url = "https://google-gemini.github.io/gemini-cli/docs/cli/"
subscription = true

[auth]
kind = "subscription"

[version_probe]
args = ["--version"]

# Pennant probe (Gemini CLI 0.42.0, 2026-07-16): the binary advertises
# `--output-format stream-json`, `--resume`, and `--session-id`, but the
# installed credentials exit with IneligibleTierError/UNSUPPORTED_CLIENT
# before any structured event is emitted. Keep this descriptor contract-less
# until a real successful stream can be recorded as a fixture.
[exec_template]
args_template = ["-p", "{prompt}"]
model_arg = "--model"
timeout_seconds = 1800

[install_hint]
url = "https://google-gemini.github.io/gemini-cli/docs/get-started/"
try_lines = ["npm install -g @google/gemini-cli"]

[ingest]
id_prefix = "gemini:"
env_var = "GEMINI_DIR"
default_dirs = ["~/.gemini"]
watch_subdirs = ["tmp"]
schema = "gemini"
cwd_match = "none"
freshness_minutes = 2
storage = "json-or-jsonl"

[[model_catalog]]
id = "provider default"
aliases = ["gemini-default"]
recommended = true

[[model_catalog]]
id = "gemini-2.5-pro"
context_window = 1048576

[[model_catalog]]
id = "gemini-2.5-flash"
context_window = 1048576
