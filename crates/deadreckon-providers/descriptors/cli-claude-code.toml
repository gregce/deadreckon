id = "cli:claude-code"
display_name = "Claude Code CLI"
kind = "cli"
default_binary = "claude"
allow_network_default = true
default_model = "provider default"
sandbox_writes = ["~/.claude"]
sandbox_reads = ["~/.claude"]
fs_detection_paths = ["~/.claude/projects"]
docs_url = "https://docs.claude.com/en/docs/claude-code/quickstart"
subscription = true

[auth]
kind = "subscription"

[version_probe]
args = ["-v"]
expect_substring = "Claude Code"

[auth_probe]
args = ["auth", "status"]
logged_in_substring = '"loggedIn": true'
logged_out_substring = '"loggedIn": false'
login_try_lines = ["claude login"]

[exec_template]
args_template = ["--dangerously-skip-permissions", "-p", "{prompt}"]
model_arg = "--model"
timeout_seconds = 1800

[install_hint]
url = "https://docs.claude.com/en/docs/claude-code/quickstart"
try_lines = ["npm i -g @anthropic-ai/claude-code"]

[ingest]
env_var = "CLAUDE_PROJECTS_DIR"
default_dirs = ["~/.claude/projects"]
schema = "claude-code"
cwd_match = "claude-project-dir"
file_glob = "*.jsonl"
freshness_minutes = 2
storage = "jsonl"
live_contract = true

[[model_catalog]]
id = "provider default"
context_window = 200000
aliases = ["claude-default"]
input_per_million = 0.0
output_per_million = 0.0
recommended = true

[[model_catalog]]
id = "fable"
context_window = 200000
aliases = ["claude-fable-5"]

[[model_catalog]]
id = "opus"
context_window = 200000
aliases = ["claude-opus"]

[[model_catalog]]
id = "sonnet"
context_window = 200000
aliases = ["claude-sonnet"]

[[model_catalog]]
id = "haiku"
context_window = 200000
aliases = ["claude-haiku"]
