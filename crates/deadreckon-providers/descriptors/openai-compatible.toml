id = "openai-compatible"
display_name = "OpenAI-compatible API"
kind = "http"
allow_network_default = true
default_model = "local-model"
docs_url = "https://platform.openai.com/docs/api-reference/chat"
subscription = false

[auth]
kind = "api-key"
env_var = "OPENAI_COMPATIBLE_API_KEY"
header = "authorization"
scheme = "bearer"

[exec_template]
request_shape = "open-ai-chat"
path_template = "/chat/completions"
timeout_seconds = 120

[install_hint]
url = "https://platform.openai.com/docs/api-reference/chat"
try_lines = [
  "export OPENAI_COMPATIBLE_BASE_URL=http://127.0.0.1:11434/v1",
  "export OPENAI_COMPATIBLE_API_KEY=local",
]

[[model_catalog]]
id = "local"
recommended = true

[[model_catalog]]
id = "provider default"
