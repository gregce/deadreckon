[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.31.0"
ci = ["github"]
# Keep GitHub release coordinates in cargo-dist's generated installers and
# package metadata. The hand-maintained workflow uses `dist plan` and `dist
# build` only; its final write-scoped `gh release` job is the sole publisher.
hosting = ["github"]
# release.yml is hand-maintained for the Release Trust pipeline (signing,
# provenance, fail-closed lanes) and intentionally diverges from the dist
# template, so skip the generated-CI consistency check during `dist plan`.
allow-dirty = ["ci"]
installers = ["shell", "powershell", "homebrew"]
publish-jobs = ["homebrew"]
tap = "gregce/homebrew-tap"
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# cargo-dist builds every application binary for the selected host target, but
# cannot add Linux-target executables to macOS/Windows archives. Release CI
# therefore builds the two static musl dr-gate evaluators separately and uses
# release/evaluator-sidecars.mjs to assemble them into every host archive and
# generated installer before signing, checksums, and attestations.
# Explicit checksum algorithm for the *.sha256 siblings and SHA256SUMS the
# release lane aggregates; the wrapper installer dies on mismatch. The inner
# cargo-dist installer does not yet verify embedded sums for tar.xz — that
# upgrade path is tracked in docs/V1-CANDIDATES.md.
checksum = "sha256"
install-path = "~/.local/share/deadreckon/bin"
install-updater = false
precise-builds = true
pr-run-mode = "plan"

# Cargo exposes the feature-gated `deadreckon-characterization` test harness as
# a binary target, so dist's automatic discovery would try to package it even
# though production builds correctly leave `internal-characterization` off.
# Keep the public runtime explicit on every platform.
[dist.binaries]
aarch64-apple-darwin = ["deadreckon", "dr-capture", "dr-gate"]
x86_64-apple-darwin = ["deadreckon", "dr-capture", "dr-gate"]
aarch64-unknown-linux-gnu = ["deadreckon", "dr-capture", "dr-gate"]
x86_64-unknown-linux-gnu = ["deadreckon", "dr-capture", "dr-gate"]
x86_64-pc-windows-msvc = ["deadreckon", "dr-capture", "dr-gate"]

[dist.min-glibc-version]
"aarch64-unknown-linux-gnu" = "2.28"
"x86_64-unknown-linux-gnu" = "2.28"
